apiVersion: v1
kind: ServiceAccount

metadata:
  name: jenkins-sa
  namespace: medical-rag-chatbot

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: jenkins-clusterrolebinding

roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io

subjects:
  - kind: ServiceAccount
    name: jenkins-sa
    namespace: medical-rag-chatbot
